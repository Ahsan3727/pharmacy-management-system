let D,U={role:'owner'},V0='sale',C=[],Q='',RS=[],hi=0,P={mode:'cash',cash:0,card:0},CU='',DP=0,RX='',rid=null,F='all',SQ='',UC=null,PL=[],PS='',PI='';
const med=id=>D.meds.find(m=>m.id==id),bt=id=>D.bats.find(b=>b.id==id),cm=id=>D.cust.find(c=>c.id==id),nid=()=>++D.id,

function alloc(id,q){let r=q;const o=[];for(const b of fefo(id)){if(r<=0)break;const t=Math.min(b.q,r);o.push({b:b.id,q:t});r-=t}return r>0?null:o}

const at=new Date().toISOString(),no=`INV-${new Date().getFullYear()}-${String(++D.seq).padStart(6,'0')}`,c=cm(x.cid),s={id:nid(),no,rid:x.rid,at,date:T(),cid:x.cid,cn:c?c.n:'Walk-in',L,...k,rx:x.rx,by:x.by,st:'ok',prev:c?c.bal:0};

if(!m)return toast('Pick a medicine from the list');if(!no)return toast('Batch number is required');if(!x)return toast('Expiry must be MM/YY');
const e1=iso(new Date(2000+ +x[2],+x[1],0));if(e1<T())return toast('That expiry date has already passed');if(!(q>0)||!(pp>0)||!(sp>0))return toast('Packs and both prices are required');

function sv(){PI=PI.trim();const s=D.sup.find(x=>x.id==PS);if(!s||!PI||!PL.length)return toast('Choose a supplier, enter the invoice no. and add a line');if(D.purs.some(p=>p.s==s.id&&p.inv==PI))return toast('Invoice '+PI+' is already entered for '+s.n);

function sk(e){const r=()=>{$('#res').innerHTML=resH();$('#inf').innerHTML=info()};if(e.key=='ArrowDown'){e.preventDefault();hi=Math.min(hi+1,RS.length-1);r()}else if(e.key=='ArrowUp'){e.preventDefault();hi=Math.max(hi-1,0);r()}else if(e.key=='Enter'){e.preventDefault();const m=D.meds.find(x=>x.bc.includes(Q.trim()))||RS[hi];if(m)ca(m.id)}}
function rcpt(id){const s=D.sales.find(x=>x.id==id),st=D.set,row=(a,v)=>`<div class=ln><span>${a}</span><b>${Rs(v)}</b></div>`;
$('#rcw').innerHTML=`<div class=rcb><div id=rc><h2>${E(st.name)}</h2><p class=c>${E(st.addr)}<br>${E(st.ph)}</p><hr><p>${s.no}${s.st=='void'?' (VOID)':''}<br>${new Date(s.at).toLocaleString('en-GB')}<br>Cashier: ${E(s.by)}<br>Customer: ${E(s.cn)}${s.rx?'<br>Rx: '+E(s.rx):''}</p><hr>${s.L.map(l=>`<div class=ln><span>${E(l.n)}<small>${l.bn} · exp ${mm(l.ex)} · ${l.u}</small></span><b>${(l.t/100).toFixed(2)}</b></div>`).join('')}<hr>${row('Subtotal',s.sub)}${s.ds?row('Discount',-s.ds):''}${s.ro?row('Round off',s.ro):''}<div class="ln big"><span>TOTAL</span><b>${Rs(s.tot)}</b></div>${s.cash?row('Cash',s.cash):''}${s.card?row('Card',s.card):''}${s.cr?row('Udhaar',s.cr)+row('Previous balance',s.prev)+row('New balance',s.bal):''}<hr><p class=c>${E(st.foot)}</p></div><div class=acts><button class=btn onclick=print()>Print</button><button class="btn ghost" onclick="$('#rcw').innerHTML=''">Close</button></div></div>`}
