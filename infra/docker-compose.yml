services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try{rs.status().ok}catch(e){rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok}"
      interval: 10s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  api:
    build: ../apps/api
    restart: unless-stopped
    env_file: ../.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/pharmacy?replicaSet=rs0
    depends_on:
      mongo:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ../apps/web/dist:/srv/web:ro
      - caddy-data:/data

volumes:
  mongo-data: {}
  caddy-data: {}
